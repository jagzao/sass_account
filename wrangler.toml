name = "plataforma-fiscal-colaborativa"
compatibility_date = "2024-11-01"
pages_build_output_dir = ".output/public"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "fiscal_platform_db"
database_id = "your-database-id"

# KV Namespace binding
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

# R2 Bucket for file storage (optional)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "fiscal-platform-storage"
